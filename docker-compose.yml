services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"
    depends_on: [hot]
    restart: unless-stopped
  hot:
    build:
      context: .
      dockerfile: deploy/hot.Dockerfile
    restart: unless-stopped
